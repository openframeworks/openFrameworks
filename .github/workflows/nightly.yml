name: nightly-linux64

# #used for testing the nightly
# on:
#   push:
#     paths-ignore:
#       - "**/*.md"
#       - "examples/**"
#   pull_request:
#     paths-ignore:
#       - "**/*.md"
#       - "examples/**"

on:
 schedule:
  - cron: "0 6 * * *"
 workflow_dispatch:
    inputs:
      release:
        description: 'release'
        required: true
        default: 'latest'
env:
  ccache: ccache
  RELEASE: latest

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  build-nightly-ok:
    runs-on: ubuntu-24.04
    # if: github.repository == 'openframeworks/openFrameworks' && github.ref == 'refs/heads/master'
    strategy:
      matrix:
        cfg:
        - {target: linux64, libs: 64}
    env:
     TARGET: ${{matrix.cfg.target}}
    steps:
    - name: Install libunwind
      run: |
        sudo apt-get -o Acquire::Retries=5 update
        sudo apt-get install -y libunwind-dev
    - name: Cache Packages
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: aptitude aptitude-common libboost-iostreams1.83.0 libcwidget4 libsigc++-2.0-0v5 libxapian30 fonts-wine{a} libasound2-plugins{a} libcapi20-3t64{a} libosmesa6{a} libpcsclite1{a} libspeexdsp1{a} libwine{a} libxkbregistry0{a} libz-mingw-w64{a} wine{a} wine64 make curl libjack-jackd2-0 libjack-jackd2-dev freeglut3-dev libasound2-dev libxmu-dev libxxf86vm-dev g++ libgl1-mesa-dev libglu1-mesa-dev libraw1394-dev libudev-dev libdrm-dev libglew-dev libopenal-dev libsndfile1-dev libfreeimage-dev libcairo2-dev libfreetype6-dev libssl-dev libpulse-dev libusb-1.0-0-dev libgtk2.0-dev libopencv-dev libassimp-dev librtaudio-dev gdb libglfw3-dev liburiparser-dev libcurl4-openssl-dev libpugixml-dev libgconf-2-4 libgtk2.0-0 libpoco-dev libxcursor-dev libxi-dev libxinerama-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-libav gstreamer1.0-pulseaudio gstreamer1.0-x gstreamer1.0-plugins-bad gstreamer1.0-alsa gstreamer1.0-plugins-base gstreamer1.0-plugins-good
        # libunwind-dev wget2
        version: 1.0

    - uses: actions/checkout@v7.0.1
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        key: ${{ matrix.cfg.target }}
    - name: Install dependencies
      run: ./scripts/ci/linux/64/install.sh;
    - name: update submodules
      run: ./scripts/dev/init_submodules.sh
    - name: Download libs
      run: ./scripts/linux/download_libs.sh -a ${{matrix.cfg.libs}};
    - name: Create Package
      run: ./scripts/ci/package_builds.sh ${{ github.event.inputs.release }};
      id: createpackage
    - name: List output directory
      run: ls -lah out/
    # - name: Upload to GitHub Release
    #   uses: danoli3/action-gh-release@ec40b04e78c39008f73c4ca3fdf9b51df604c4ed # softprops/action-gh-release#852 (v3, node24)
    #   with:
    #     token: ${{ secrets.GITHUB_TOKEN }}
    #     tag_name: "nightly"
    #     files: |
    #       out/of_v*.tar.gz
    #       out/of_v*.zip
    # Upload into a draft first, then swap it in as "nightly": the current nightly stays
    # available until the new one is complete, and the nightly tag moves to this commit.
    - name: Publish nightly
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        shopt -s nullglob
        files=(out/of_v*.tar.gz out/of_v*.zip)
        if [ ${#files[@]} -eq 0 ]; then
          echo "::error::No packages were built - keeping the current nightly"
          exit 1
        fi
        notes="Nightly openFrameworks build from ${SHA:0:7} ($(date -u +%Y-%m-%d))."
        if [ -f out/package_summary.md ]; then
          notes="$notes"$'\n\n'"$(cat out/package_summary.md)"
        fi
        gh release delete nightly-staging --repo "$REPO" --cleanup-tag --yes 2> /dev/null || true
        gh release create nightly-staging "${files[@]}" --repo "$REPO" --draft --target "$SHA" \
          --title "Nightly Release" --notes "$notes"
        gh release delete nightly --repo "$REPO" --cleanup-tag --yes 2> /dev/null || true
        id=$(gh api "repos/$REPO/releases" --jq '.[] | select(.draft and .tag_name == "nightly-staging") | .id' | head -1)
        gh api -X PATCH "repos/$REPO/releases/$id" -f tag_name=nightly -f target_commitish="$SHA" -F draft=false > /dev/null
        gh release view nightly --repo "$REPO" --json tagName,publishedAt,assets \
          --jq '"\(.tagName) published \(.publishedAt) with \(.assets | length) files"'
    # package_builds.sh keeps going when a package fails, so the nightly has every package
    # that built; fail the run afterwards so a missing package doesn't go unnoticed
    - name: Check every package built
      run: |
        if grep -q "| FAILED |" out/package_summary.md; then
          grep "| FAILED |" out/package_summary.md | sed 's/^/::error::Package failed: /'
          exit 1
        fi
