# Build the full set of openFrameworks packages for a release tag and upload
# them to its GitHub release. Fires automatically on a version tag push, or by
# hand via workflow_dispatch (optionally against an override apothecary tag).
#
# Same build engine as nightly.yml: one linux64 runner runs
# scripts/ci/package_builds.sh, which cross-packages every platform from
# apothecary libs it downloads. For a numeric tag, download_libs.sh is fed
# -t <apothecary release> derived from the OF tag via apothecary_release_tag.sh
# (0.12.2 and 0.12.2-RC1 -> v12.2.0); workflow_dispatch may override that
# apothecary tag.

name: manual-release

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      release:
        description: "openFrameworks release name (empty on a tag push -> the pushed tag)"
        required: false
        default: ""
      apothecary_tag:
        description: "Apothecary release to pull libs from (e.g. v12.2.0). Empty = derive from the release."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  ccache: ccache
  RELEASE: ${{ github.event.inputs.release || github.ref_name }}

jobs:
  manual-nightly:
    runs-on: ubuntu-24.04
    if: github.repository == 'openframeworks/openFrameworks' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    strategy:
      matrix:
        cfg:
          - { target: linux64, libs: 64 }
    steps:
      - name: Install libunwind
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get install -y libunwind-dev
      - name: Cache Packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: aptitude aptitude-common libboost-iostreams1.83.0 libcwidget4 libsigc++-2.0-0v5 libxapian30 fonts-wine{a} libasound2-plugins{a} libcapi20-3t64{a} libosmesa6{a} libpcsclite1{a} libspeexdsp1{a} libwine{a} libxkbregistry0{a} libz-mingw-w64{a} wine{a} wine64 make curl libjack-jackd2-0 libjack-jackd2-dev freeglut3-dev libasound2-dev libxmu-dev libxxf86vm-dev g++ libgl1-mesa-dev libglu1-mesa-dev libraw1394-dev libudev-dev libdrm-dev libglew-dev libopenal-dev libsndfile1-dev libfreeimage-dev libcairo2-dev libfreetype6-dev libssl-dev libpulse-dev libusb-1.0-0-dev libgtk2.0-dev libopencv-dev libassimp-dev librtaudio-dev gdb libglfw3-dev liburiparser-dev libcurl4-openssl-dev libpugixml-dev libgconf-2-4 libgtk2.0-0 libpoco-dev libxcursor-dev libxi-dev libxinerama-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-libav gstreamer1.0-pulseaudio gstreamer1.0-x gstreamer1.0-plugins-bad gstreamer1.0-alsa gstreamer1.0-plugins-base gstreamer1.0-plugins-good
          # libunwind-dev wget2
          version: 1.0

      - uses: actions/checkout@v7.0.1
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.cfg.target }}
      - name: update submodules
        run: ./scripts/dev/init_submodules.sh
      - name: Install dependencies
        run: ./scripts/ci/linux/64/install.sh;
      - name: Resolve apothecary tag
        id: apo
        shell: bash
        env:
          APO_OVERRIDE: ${{ github.event.inputs.apothecary_tag }}
        run: |
          set -euo pipefail
          source scripts/dev/apothecary_release_tag.sh
          if [[ -n "${APO_OVERRIDE:-}" ]]; then
            # literal: an override is used as-is so hotfix / RC apothecary
            # tags (e.g. v12.2.0-hotfix1) are not folded back to v12.2.0 by
            # the formula.
            resolved="$APO_OVERRIDE"
            echo "$RELEASE -> apothecary $resolved (workflow_dispatch override, used literally)"
          else
            resolved=$(apothecary_release_tag "$RELEASE")
            if ! [[ "$resolved" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              echo "::error title=No apothecary release to use::Can't derive one from RELEASE='$RELEASE' and no apothecary_tag override was given. Dispatch with apothecary_tag set."
              exit 1
            fi
            echo "$RELEASE -> apothecary $resolved (derived from $RELEASE)"
          fi
          echo "tag=$resolved" >> "$GITHUB_OUTPUT"
      - name: Download libs
        run: ./scripts/linux/download_libs.sh -a ${{ matrix.cfg.libs }} -t ${{ steps.apo.outputs.tag }};
      - name: Create Package
        run: scripts/ci/package_builds.sh "$RELEASE";
        id: createpackage
      - name: List output directory
        run: ls -lah out/
      - name: Update Release
        if: github.repository == 'openframeworks/openFrameworks'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          FILES_OUT: ${{ steps.createpackage.outputs.FILES_OUT }}
          APO_TAG: ${{ steps.apo.outputs.tag }}
        run: |
          set -euo pipefail
          PRERELEASE=false
          if [[ "$RELEASE" =~ -([Rr][Cc]|beta|alpha) ]]; then PRERELEASE=true; fi
          NOTES="openFrameworks $RELEASE built against apothecary $APO_TAG."
          NOTES="$NOTES"$'\n\n'"[Package build summary](${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID})"
          gh release view "$RELEASE" > /dev/null 2>&1 \
            || gh release create "$RELEASE" --title "$RELEASE" --target "$GITHUB_SHA" --notes "$NOTES" ${PRERELEASE:+--prerelease}
          gh release edit "$RELEASE" --title "$RELEASE" --prerelease=$PRERELEASE
          gh release upload "$RELEASE" $FILES_OUT --clobber
      # package_builds.sh keeps going when a package fails, so the release has every package
      # that built; fail the run afterwards so a missing package doesn't go unnoticed.
      - name: Check every package built
        shell: bash
        run: |
          if [[ -f out/package_summary.md ]] && grep -q "| FAILED |" out/package_summary.md; then
            grep "| FAILED |" out/package_summary.md | sed 's/^/::error::Package failed: /'
            exit 1
          fi
