name: Cleanup Caches by Cron

# GitHub LRU-evicts at ~10 GB. This job used to delete every master cache
# daily, including ccache/sccache, so PRs could not restore-keys into a warm
# compile cache. Keep compile caches; drop other master entries (apt, msys2,
# leftover tarball caches) that compete for the cap.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Set Up GitHub CLI
        run: |
          sudo apt-get update && sudo apt-get install -y gh
          gh extension install actions/gh-actions-cache || echo "Extension already installed"

      - name: Cleanup non-compile caches on master
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO=${{ github.repository }}
          BRANCH="master"

          echo "Listing caches for branch: $BRANCH"
          cacheKeys=$(gh actions-cache list -R "$REPO" -B "$BRANCH" --json key | jq -r '.[].key')

          if [ -z "$cacheKeys" ]; then
            echo "No caches found for branch: $BRANCH"
            exit 0
          fi

          kept=0
          deleted=0
          while IFS= read -r cacheKey; do
            [ -z "$cacheKey" ] && continue
            case "$cacheKey" in
              ccache-*|sccache-*)
                echo "Keeping compile cache: $cacheKey"
                kept=$((kept + 1))
                ;;
              *)
                echo "Deleting cache: $cacheKey"
                gh actions-cache delete "$cacheKey" -R "$REPO" -B "$BRANCH" --confirm || echo "delete failed: $cacheKey"
                deleted=$((deleted + 1))
                ;;
            esac
          done <<< "$cacheKeys"
          echo "Kept $kept compile cache(s), deleted $deleted other cache(s)."
