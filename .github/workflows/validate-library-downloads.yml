name: Validate library downloads
on:
  pull_request:
    paths:
      - scripts/dev/download_libs.sh
      - scripts/dev/downloader.sh
      - scripts/dev/sha_verify.sh
      - scripts/dev/tests/test-download-validation.sh
      - .github/workflows/validate-library-downloads.yml
  push:
    branches: [master]
    paths:
      - scripts/dev/download_libs.sh
      - scripts/dev/downloader.sh
      - scripts/dev/sha_verify.sh
      - scripts/dev/tests/test-download-validation.sh
      - .github/workflows/validate-library-downloads.yml
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: bash -n scripts/dev/download_libs.sh scripts/dev/downloader.sh scripts/dev/sha_verify.sh
      - run: bash scripts/dev/tests/test-download-validation.sh
